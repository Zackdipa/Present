  <style>
    /* Align text with image - responsive media block */
    .media {
      display: flex;
      align-items: center;
      gap: 1rem;
      max-width: 1000px;
      margin: 2rem auto;
      padding: 1rem;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .media img {
      width: 300px;
      height: auto;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .media .text {
      flex: 1;
    }

    .media .text h2 {
      margin: 0 0 0.5rem 0;
      font-size: 3.5rem;
    }

    .media .text p {
      margin: 0;
      line-height: 1.5;
      font-size: 1.2rem;
    }

    @media (max-width: 600px) {
      .media {
        flex-direction: column;
        text-align: center;
      }
      .media img {
        width: 100%;
        max-width: 300px;
      }
      .media .text h2 {
        margin-top: 0.5rem;
      }
    }
  </style>
